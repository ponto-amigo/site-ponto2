</g>

<!-- caption -->
<g>
  <text x="120" y="120" font-family="Inter, ui-sans-serif" font-size="44" font-weight="700" fill="#0A4D8C" opacity="0.95">Suporte humano, processo claro</text>
  <text x="120" y="170" font-family="Inter, ui-sans-serif" font-size="20" fill="#2E2E2E" opacity="0.7">Visual de apoio (ilustração) com identidade Ponto Amigo</text>
