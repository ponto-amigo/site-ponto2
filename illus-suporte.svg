<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A4D8C" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#19C5D8" stop-opacity="0.10"/>
  </linearGradient>
  <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19C5D8" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#0A4D8C" stop-opacity="0.08"/>
  </linearGradient>
  <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="20"/>
  </filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#001A33" flood-opacity="0.18"/>
  </filter>
</defs>

<rect width="1200" height="800" rx="40" fill="#F3F6FB"/>
<circle cx="1001" cy="761" r="213" fill="url(#g1)" filter="url(#blur20)"/><circle cx="718" cy="532" r="168" fill="url(#g2)" filter="url(#blur20)"/><circle cx="230" cy="352" r="217" fill="url(#g1)" filter="url(#blur20)"/><circle cx="637" cy="92" r="197" fill="url(#g2)" filter="url(#blur20)"/><circle cx="1046" cy="130" r="184" fill="url(#g1)" filter="url(#blur20)"/>

<g opacity="0.1" transform="translate(260,240) scale(1.15)">
  <circle cx="0" cy="0" r="92" fill="#19C5D8"/>
  <circle cx="0" cy="0" r="74" fill="none" stroke="#0A4D8C" stroke-width="26" opacity="0.7"/>
  <circle cx="-28" cy="-14" r="10" fill="#0A4D8C" opacity="0.8"/>
  <circle cx="28" cy="-14" r="10" fill="#0A4D8C" opacity="0.8"/>
  <path d="M -42 18 C -22 48, 22 48, 42 18" fill="none" stroke="#0A4D8C" stroke-width="14" stroke-linecap="round"/>
</g>


<g opacity="0.08" transform="translate(980,520) scale(0.95)">
  <circle cx="0" cy="0" r="92" fill="#19C5D8"/>
  <circle cx="0" cy="0" r="74" fill="none" stroke="#0A4D8C" stroke-width="26" opacity="0.7"/>
  <circle cx="-28" cy="-14" r="10" fill="#0A4D8C" opacity="0.8"/>
  <circle cx="28" cy="-14" r="10" fill="#0A4D8C" opacity="0.8"/>
  <path d="M -42 18 C -22 48, 22 48, 42 18" fill="none" stroke="#0A4D8C" stroke-width="14" stroke-linecap="round"/>
</g>

<!-- floating cards -->
<g filter="url(#shadow)">
  <rect x="660" y="150" width="420" height="260" rx="28" fill="white" opacity="0.96"/>
  <rect x="700" y="196" width="210" height="16" rx="8" fill="#0A4D8C" opacity="0.20"/>
  <rect x="700" y="230" width="330" height="12" rx="6" fill="#0A4D8C" opacity="0.14"/>
  <rect x="700" y="254" width="290" height="12" rx="6" fill="#0A4D8C" opacity="0.12"/>
  <rect x="700" y="290" width="160" height="42" rx="21" fill="#0A4D8C" opacity="0.18"/>
  <circle cx="1030" cy="308" r="18" fill="#19C5D8" opacity="0.28"/>
</g>

<g filter="url(#shadow)">
  <rect x="120" y="470" width="520" height="230" rx="28" fill="white" opacity="0.96"/>
  <rect x="165" y="515" width="240" height="16" rx="8" fill="#0A4D8C" opacity="0.18"/>
  <rect x="165" y="550" width="400" height="12" rx="6" fill="#0A4D8C" opacity="0.12"/>
